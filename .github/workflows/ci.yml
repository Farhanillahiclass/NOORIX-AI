name: CI

# Hosted runs are intentionally paused while the account Actions allowance is
# exhausted. The complete validation suite will be run locally in one batch.
# Do not use workflow_dispatch until the owner explicitly authorizes it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Local validation is the release gate
    runs-on: ubuntu-latest
    steps:
      - name: Explain local validation policy
        run: |
          echo "Hosted CI is paused to avoid consuming Actions minutes."
          echo "Run: python scripts/run_full_validation.py"
