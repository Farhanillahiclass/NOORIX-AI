name: Validate Kaggle notebooks
on:
  push:
    paths:
      - "notebooks/**"
      - "scripts/validate_kaggle_notebooks.py"
      - ".github/workflows/validate-kaggle-notebooks.yml"
  pull_request:
    paths:
      - "notebooks/**"
      - "scripts/validate_kaggle_notebooks.py"
      - ".github/workflows/validate-kaggle-notebooks.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate notebook JSON and Python syntax
        run: python scripts/validate_kaggle_notebooks.py
