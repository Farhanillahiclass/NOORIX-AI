[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noorix-ai"
version = "0.2.0"
description = "Offline multimodal accessibility assistant research prototype"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "packaging>=23"]
camera = ["opencv-python>=4.9", "Pillow>=10"]
speech = ["pyttsx3>=2.90"]
ocr = ["pytesseract>=0.3.13", "Pillow>=10"]
onnx = ["onnxruntime>=1.18", "numpy>=1.26"]
all = [
  "opencv-python>=4.9",
  "pyttsx3>=2.90",
  "pytesseract>=0.3.13",
  "Pillow>=10",
  "onnxruntime>=1.18",
  "numpy>=1.26"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"
